<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Officer Portal Login — CyberCrime Portal</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/citizen.css">
  <link rel="stylesheet" href="css/officer.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="brand">
      <div class="brand-icon">🕵️‍♂️</div>
      <div>CyberCrime <span class="highlight">Officer Desk</span></div>
    </a>
    <ul class="nav-links">
      <li><a href="index.html" class="nav-link">Home</a></li>
      <li><a href="helpline-desk.html" class="nav-link">Helpline Desk</a></li>
      <li><a href="citizen-login.html" class="nav-link">Citizen Login</a></li>
      <li><a href="officer-login.html" class="nav-link active">Officer Login</a></li>
    </ul>
  </nav>

  <div class="auth-wrapper">
    <div class="glass-card auth-card">
      
      <div class="auth-header">
        <div class="icon-circle" style="background: rgba(239, 68, 68, 0.12); border-color: rgba(239, 68, 68, 0.3); color: var(--accent-red);">🛡️</div>
        <span class="badge badge-priority-HIGH" style="margin-bottom: 0.5rem;">Cybercrime Officer Portal</span>
        <h2>Authorized Personnel Login</h2>
        <p>Access restricted to verified cybercrime police officers and investigation cell administrators.</p>
      </div>

      <form id="officerLoginForm">
        
        <div class="form-group">
          <label for="identifier">Badge Number or Official Email</label>
          <input type="text" id="identifier" class="form-control" placeholder="e.g. CYBER-8841 or rajesh.kumar@cyberpolice.gov.in" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••••••" required>
        </div>

        <div style="margin-top: 1.5rem;">
          <button type="submit" class="btn btn-primary btn-full" style="font-size: 1rem; padding: 0.85rem;">
            Authenticate & Open Review Dashboard
          </button>
        </div>

      </form>

    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/mobile-nav.js"></script>
  <script src="js/officer-auth.js"></script>
</body>
</html>
